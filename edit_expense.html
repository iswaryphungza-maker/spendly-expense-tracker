{% extends 'base.html' %}{% block title %}Edit expense{% endblock %}{% block content %}<section class="edit-wrap"><a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><div class="panel edit-panel"><div class="card-kicker">UPDATE YOUR RECORD</div><h1>Edit expense</h1><p class="muted">Only you can change this expense.</p><form method="post" class="expense-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>What did you spend on?<input name="title" maxlength="120" required value="{{ expense.title }}"></label><div class="form-row"><label>Amount (₹)<input type="number" name="amount" min="0.01" max="9999999999.99" step="0.01" required value="{{ '%.2f'|format(expense.amount) }}"></label><label>Date<input type="date" name="spent_on" required value="{{ expense.spent_on.isoformat() }}"></label></div><div class="form-row"><label>Category<select name="category">{% for item in categories %}<option {% if expense.category == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Paid with<select name="payment_method">{% for item in payment_methods %}<option {% if expense.payment_method == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label></div><label>Notes <span class="optional">OPTIONAL</span><input name="notes" maxlength="500" value="{{ expense.notes or '' }}"></label><div class="form-row edit-actions"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-quiet" href="{{ url_for('dashboard') }}">Cancel</a></div></form></div></section>{% endblock %}
